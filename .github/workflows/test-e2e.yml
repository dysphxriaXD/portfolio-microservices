name: "Test E2E"

on:
  workflow_call:

jobs:
  test-e2e:
    name: "E2E tests"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: '**/go.sum'

      - name: Cache task-installed binaries
        uses: actions/cache@v6.0.0
        with:
          path: bin
          key: ${{ runner.os }}-task-bin-${{ hashFiles('Taskfile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-task-bin-

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Стенду e2e (образы сервисов, Kafka, Postgres, Redis, а с недели 7 ещё и коллектор
      # телеметрии) не хватает свободного места раннера: Kafka упирается в диск, и запросы
      # падают с 500. Предустановленные .NET, Android, Haskell и CodeQL проекту не нужны.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Run E2E tests
        run: task test:e2e
